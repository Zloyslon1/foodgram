server {
  listen 80;
  index index.html;
  server_tokens off;
  # Картинки приходят строкой base64 внутри JSON — поднимаем лимит
  client_max_body_size 10M;

  # location выбирается по самому длинному совпавшему префиксу,
  # поэтому /api/docs/ обрабатывается раньше, чем /api/ (PRD §4.5)
  location /api/docs/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/redoc.html;
  }

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  # Короткие ссылки на рецепты
  location /s/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/s/;
  }

  # Файлы, загруженные пользователями, — из volume media
  location /media/ {
    alias /media/;
  }

  location / {
    alias /static/;
    try_files $uri $uri/ /index.html;
  }
}
